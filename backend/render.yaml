services:
  - type: web
    name: face-emotion-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000 --ws-max-size 7340032"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: true
      - key: ALLOWED_ORIGINS
        value: https://face-emotion-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000
